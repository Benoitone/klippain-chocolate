
#--------------------------------------------------#
#### BTT EBB SB2209 USB v1.0 MCU definition ########
#--------------------------------------------------#

[mcu toolhead]
##--------------------------------------------------------------------
serial: /dev/serial/by-id/change-me-to-the-correct-mcu-path
##--------------------------------------------------------------------

# If you want to override the wiring of the BTT SB2209 USB, keep in mind that this
# board is defined using the "toolhead" name. So you should use "pin: toolhead:PIN_NAME"
# in your own overrides.cfg files.

[include config/mcu_definitions/toolhead/BTT_EBB_SB2209_USB_v1.0.cfg] # Do not remove this line
[board_pins sb2209_mcu]
mcu: toolhead
aliases:
    E_STEP=MCU_MOTORDRIVE_STEP , E_DIR=MCU_MOTORDRIVE_DIR , E_ENABLE=MCU_MOTORDRIVE_ENABLE , E_TMCUART=MCU_MOTORDRIVE_UART ,

    X_STOP=MCU_ENDSTOP        ,
    PROBE_INPUT=MCU_PROBE1    ,
    TOOLHEAD_SENSOR=MCU_STOP3 ,

    E_HEATER=MCU_HE0 , E_TEMPERATURE=MCU_TH0 ,

    PART_FAN=MCU_FAN1         , E_FAN=MCU_FAN2          ,
    4LFAN_TACH=MCU_4LFAN_TACH , 4LFAN_PWM=MCU_4LFAN_PWM ,

    STATUS_NEOPIXEL=MCU_RGB  ,
    STATUS_LED=MCU_STATUS    ,
   

    LIS2DW_MISO=MCU_LIS2DW_MISO , LIS2DW_CS=MCU_LIS2DW_CS     , LIS2DW_SCLK=MCU_LIS2DW_CK  , 
    LIS2DW_MOSI=MCU_LIS2DW_MOSI , LIS2DW_INT1=MCU_LIS2DW_INT1 , 


#------------------------------------------------#
#    BTT EBB SB2209 USB v1.0 pins remapping      #
#------------------------------------------------#

# These pins overrides are automatically added when you select a CANbus
# toolhead MCU during the installation process. They should provide a
# good base to work with. Feel free to adapt to your board if needed!

[extruder]
step_pin: toolhead:E_STEP
dir_pin: toolhead:E_DIR
enable_pin: !toolhead:E_ENABLE
heater_pin: toolhead:E_HEATER
pullup_resistor: 2200 # 2.2K
sensor_type: EPCOS 100K B57560G104F
sensor_pin: toolhead:E_TEMPERATURE

[probe]
pin: ^toolhead:PROBE_INPUT

[fan]
pin: toolhead:PART_FAN

[heater_fan hotend_fan]
pin: toolhead:E_FAN

## Uncomment the following line if not using sensorless homing
## and having the X endstop plugged to the toolhead MCU
# [stepper_x]
# endstop_pin: ^toolhead:X_STOP

[neopixel status_leds]
pin: toolhead:STATUS_NEOPIXEL

[tmc2209 extruder]
uart_pin: toolhead:E_TMCUART

## Uncomment the following line to use 4L Fan
#[fan_generic 4W_FAN]
# pin: toolhead:4LFAN_PWM
# tachometer_pin: toolhead:4LFAN_TACH
## tachometer_ppr: 1

## Uncomment the following line to use lis2dw toolhead accelerometer
# [include hardware/accelerometer/generics/lis2dw_software_spi.cfg]
# [lis2dw]
# axes_map: z,x,y